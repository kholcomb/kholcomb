name: Heckler
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  heckler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan for dangerous invisible Unicode
        uses: kholcomb/heckler@daf52987d6c2f136d8341dc40295a0a226d13e28  # v1.1.0

name: Heckler
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  heckler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scan for dangerous invisible Unicode
        uses: kholcomb/heckler@b79ae5c16f01487aad70298fda7d97a3305877f2  # v2.0.0
